<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#2b2d31;--line:#3a3d43;--card:#34373d;--tx:#ececec;--mut:#a9adb5;--ac:#f0b35a}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font-family:Georgia,'Times New Roman',serif;background:var(--bg) repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);min-height:100vh}
h1{text-align:center;margin:0;padding:32px 16px 8px;font-size:clamp(26px,5vw,42px);letter-spacing:.5px}
.sub{text-align:center;color:var(--mut);margin:0 0 24px}
main{max-width:760px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:20px}
.t{background:var(--card);border:1px solid #484c54;border-radius:14px;padding:18px;box-shadow:0 4px 14px rgba(0,0,0,.3);animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.t h2{margin:0 0 12px;color:var(--ac);font-size:22px}
.q{padding:12px 0;border-top:1px dashed #555a63}
.q p{margin:0 0 10px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--ac);color:#2b2d31;font-weight:bold;transition:transform .18s,box-shadow .18s,background .18s}
button:hover{transform:translateY(-3px);box-shadow:0 6px 14px rgba(240,179,90,.35);background:#ffc678}
button:active{transform:scale(.94);box-shadow:none}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.a.open{grid-template-rows:1fr}
.a>div{overflow:hidden}
.a .in{margin-top:12px;padding:12px 14px;border-left:3px solid var(--ac);background:rgba(0,0,0,.2);border-radius:0 10px 10px 0;line-height:1.55;color:#ddd}
.a .in p{margin:0 0 8px}
.na{color:var(--mut);font-style:italic}

<script>
var T=[
[["Чем интересен образ Агафьи Пшеницыной? Согласны ли вы с мнением, что она «гораздо более женщина, чем Ольга»?","Агафья Матвеевна Пшеницына — одна из главных героинь романа И. А. Гончарова «Обломов». Она простая, хозяйственная, добрая и заботливая женщина. Её любовь к Обломову проявляется не в красивых словах, а в повседневной заботе: она готовит ему еду, поддерживает порядок в доме, создаёт уют.\nОльга Ильинская, напротив, стремится развивать Обломова, изменить его образ жизни, пробудить в нём активность. Агафья принимает его таким, какой он есть.\nЯ согласен, что Агафья «более женщина» в традиционном понимании: она олицетворяет материнскую заботу, преданность и домашний уют. Однако Ольга интереснее как самостоятельная и деятельная личность. Обе героини по-своему раскрывают разные стороны любви."],
["А. А. Фет и Ф. И. Тютчев. Поэзия: темы и образы (чтение наизусть).","Повторить вопрос и подготовить стихотворения для чтения наизусть."]],
[["Какие вопросы стали причиной споров Евгения Базарова и Павла Петровича Кирсанова? Какой точки зрения придерживался каждый из них? Чья позиция вам ближе и почему?","Споры касаются искусства, науки, любви, природы, общественного устройства, роли дворянства и принципов в жизни.\nПавел Петрович защищает старые порядки, аристократию, традиции и общепринятые ценности. Он считает, что общество должно развиваться постепенно.\nБазаров придерживается нигилизма: отрицает авторитеты, не принимает старые принципы, всё проверяет практикой и разумом. «Природа не храм, а мастерская, и человек в ней работник».\nМне ближе стремление Базарова самостоятельно мыслить, но я не согласен с его полным отрицанием искусства и духовных ценностей. Нельзя разрушать всё старое, не предлагая ничего взамен."],
["Что означает определение «обломовщина»?","Обломовщина — образ жизни, характеризующийся ленью, бездействием, апатией, боязнью перемен и неспособностью воплощать мечты в реальность. Термин происходит от фамилии героя романа И. А. Гончарова «Обломов».\nИлья Ильич мечтает о счастливой жизни, но не желает прилагать усилия, постоянно откладывает дела. В главе «Сон Обломова» показано, что с детства его приучали к праздности и зависимости от окружающих.\nОбломовщина — не просто лень, а социальное и психологическое явление, которое мешает человеку развиваться."]],
[["Самодуры города Калинова. Дайте им характеристику. На чём основывается их власть над окружающими? (Монолог Кулигина наизусть.)","Самодуры — жестокие, властные и самоуверенные люди, которые привыкли распоряжаться судьбами окружающих. В пьесе А. Н. Островского «Гроза» это Дикой и Кабаниха.\nСавел Прокофьевич Дикой — богатый купец, грубый, вспыльчивый и жадный. Он унижает работников, родственников и всех, кто от него зависит.\nМарфа Игнатьевна Кабанова (Кабаниха) — богатая купчиха, которая прикрывает жестокость соблюдением старых традиций. Она контролирует жизнь сына Тихона и его жены Катерины.\nИх власть основывается на богатстве, общественном положении, страхе окружающих и зависимости людей от их денег.\nКулигин характеризует город словами: «Жестокие нравы, сударь, в нашем городе, жестокие!»\nМонолог Кулигина необходимо выучить наизусть.","Кулигин. Жестокие нравы, сударь, в нашем городе, жестокие! В мещанстве, сударь, вы ничего, кроме грубости да бедности нагольной, не увидите. И никогда нам, сударь, не выбиться из этой коры! Потому что честным трудом никогда не заработать нам больше насущного хлеба. А у кого деньги, сударь, тот старается бедного закабалить, чтобы на его труды даровые еще больше денег наживать. Знаете, что ваш дядюшка, Савел Прокофьич, городничему отвечал? К городничему мужички пришли жаловаться, что он ни одного из них путем не разочтет. Городничий и стал ему говорить: «Послушай, говорит, Савел Прокофьич, рассчитывай ты мужиков хорошенько! Каждый день ко мне с жалобой ходят!» Дядюшка ваш потрепал городничего по плечу, да и говорит: «Стоит ли, ваше высокоблагородие, нам с вами об таких пустяках разговаривать! Много у меня в год-то народу перебывает; вы то поймите: недоплачу я им по какой-нибудь копейке на человека, а у меня из этого тысячи составляются, так оно мне и хорошо!» Вот как, сударь! А между собой-то, сударь, как живут! Торговлю друг у друга подрывают, и не столько из корысти, сколько из зависти. Враждуют друг на друга; залучают в свои высокие-то хоромы пьяных приказных, таких, сударь, приказных, что и виду-то человеческого на нем нет, обличье-то человеческое истеряно. А те им, за малую благостыню, на гербовых листах злостные кляузы строчат на ближних. И начнется у них, сударь, суд да дело, и несть конца мучениям. Судятся-судятся здесь, да в губернию поедут, а там уж их и ждут да от радости руками плещут. Скоро сказка сказывается, да не скоро дело делается; водят их, водят, волочат их, волочат; а они еще и рады этому волоченью, того только им и надобно. «Я, говорит, потрачусь, да уж и ему станет в копейку». Я было хотел все это стихами изобразить..."],["Какую идейно-смысловую роль играет «Сон Обломова» для понимания образа главного героя?","«Сон Обломова» помогает понять причины характера Ильи Ильича. Автор показывает детство героя в Обломовке — месте, где люди живут спокойно, избегают труда и не стремятся к переменам.\nМаленького Илюшу окружали заботой, ему почти ничего не позволяли делать самостоятельно: за него всё выполняли родители и слуги.\nТакое воспитание сформировало пассивность, зависимость от других и страх перед самостоятельной жизнью. Обломовка стала для героя идеалом счастья, к которому он стремился всю жизнь.\nТаким образом, «Сон Обломова» объясняет происхождение обломовщины и помогает понять, почему герой не смог изменить свою жизнь."]],
[["Анна Сергеевна Одинцова. Дайте характеристику. Почему Одинцова отвергает любовь Базарова, заставив его предварительно признаться в своих чувствах?","Анна Сергеевна Одинцова — умная, образованная, красивая и независимая женщина из романа И. С. Тургенева «Отцы и дети».\nОна привыкла к спокойной, размеренной жизни и ценит личную независимость. Базаров вызывает у неё интерес, потому что отличается от большинства окружающих.\nОднако Базаров неожиданно для себя влюбляется в неё, и это разрушает его убеждение, что любовь — лишь физиология. Он признаётся: «Я люблю вас глупо, безумно...»\nОдинцова не отвечает взаимностью, потому что боится потерять привычное спокойствие и независимость. Ей интересен Базаров, но она не готова связать с ним жизнь.\nЭта ситуация показывает, что даже сильный человек не всегда способен управлять своими чувствами."],["В чём смысл финала романа «Обломов»? Как интерпретировать решение автора «отдать» сына Обломова на воспитание в семью Штольца?","В финале Обломов умирает, так и не реализовав своих мечтаний. Его жизнь проходит спокойно, но почти бесполезно с точки зрения общественной деятельности.\nСын Обломова, Андрей, после смерти отца оказывается в семье Штольца. Это символично: автор даёт ребёнку возможность получить другое воспитание и избежать судьбы отца.\nШтольц и Ольга должны воспитать Андрея активным, самостоятельным и образованным человеком.\nВ финале сохраняется и трагическая мысль: одного происхождения недостаточно, чтобы определить судьбу человека, важнейшую роль играет воспитание."]],
[["Что такое нигилизм? В чём заключается нигилизм Базарова? Каковы его жизненные принципы? В чём слабость его позиции?","Нигилизм — мировоззрение, основанное на отрицании общепринятых авторитетов, традиций и ценностей.\nБазаров считает, что нельзя принимать чужие убеждения без доказательств. Он доверяет науке, практическому опыту и разуму, отрицает романтизм, искусство, поэзию и традиционные представления о любви. Его позиция выражена в словах: «Природа не храм, а мастерская, и человек в ней работник».\nСлабость позиции — в чрезмерном отрицании. Он считает ненужными чувства и духовные ценности, но сам влюбляется в Одинцову, и его жизнь опровергает его убеждения.\nТургенев показывает, что человек не может жить только разумом и отрицанием: ему необходимы чувства, любовь и духовные ориентиры."],["«Не всё то золото, что блестит». Объясните смысл пословицы. Кого из героев произведений 10 класса можно привести в качестве иллюстрации?","Пословица означает, что внешность, богатство и положение не всегда отражают настоящую сущность человека.\nХороший пример — Сергей Паратов из «Бесприданницы» А. Н. Островского. Он кажется обаятельным, щедрым и благородным, но руководствуется выгодой. На вопрос Кнурова, не жаль ли продавать «Ласточку», он отвечает: «Что такое „жаль“, этого я не знаю». Для него материальная выгода важнее привязанности и чувств.\nДругой пример — Агафья Пшеницына из «Обломова»: у неё нет образования и светских манер, но она искренне добра и предана.\nИстинная ценность человека определяется не внешним блеском, а поступками и внутренними качествами."]],
[["Ольга Ильинская, на ваш взгляд, положительная или отрицательная героиня? Почему не сложились отношения Ольги и Обломова?","Ольга Ильинская — положительная героиня романа «Обломов»: умная, образованная, деятельная, стремящаяся к постоянному развитию.\nОна влюбляется в Обломова и пытается изменить его жизнь: хочет, чтобы он стал активнее, занялся делами и вышел из апатии.\nОтношения не складываются, потому что герои по-разному понимают счастье. Ольга хочет видеть рядом деятельного человека, а Обломов мечтает о покое, уюте и отсутствии забот. Он понимает, что не может соответствовать её ожиданиям, и отдаляется.\nОльга любит не только самого Обломова, но и образ человека, которым он мог бы стать. Любовь оказывается невозможной из-за различия характеров и жизненных целей."],["«Родительский наказ» — известный приём в русской литературе. Приведите примеры и объясните, как «наказ отца» отразился на жизни и поступках героев.","Родительский наказ часто становится важным нравственным ориентиром для героев.\nЯркий пример — «Капитанская дочка» А. С. Пушкина. Отец говорит Петру Гринёву: «Береги честь смолоду». Эти слова становятся главным принципом Гринёва: даже в сложных обстоятельствах он остаётся честным и верным присяге.\nДругой пример — «Отцы и дети» И. С. Тургенева. Родители любят Базарова и гордятся им, но он не всегда принимает их взгляды и стремится жить самостоятельно.\nРодительский наказ может стать нравственной опорой, но окончательный выбор пути всегда остаётся за человеком."]],
[["Андрей Штольц — антипод Обломова или его двойник? Аргументируйте свой ответ.","Андрей Штольц является антиподом Обломова, поскольку их характеры и жизненные принципы противоположны.\nШтольц активен, трудолюбив, целеустремлён и постоянно занимается делами. Он стремится к развитию и не боится трудностей. Обломов, наоборот, пассивен, мечтателен и предпочитает спокойную жизнь.\nОднако у героев есть общие черты: оба ценят дружбу, искренность и доброту. Штольц не оставляет Обломова в трудную минуту и пытается ему помочь.\nШтольц олицетворяет деятельность, а Обломов — покой и мечтательность. Я считаю, что Штольц прежде всего антипод Обломова, но их дружба показывает, что противоположные люди могут дополнять друг друга."],["Дайте характеристику Марфе Игнатьевне Кабановой. Чем страшен этот образ?","Марфа Игнатьевна Кабанова — богатая купчиха из пьесы А. Н. Островского «Гроза». Она властная, строгая, деспотичная и лицемерная женщина.\nКабаниха требует беспрекословного подчинения, прикрывая свои требования уважением к старым традициям. Она постоянно унижает Катерину, контролирует сына Тихона и не позволяет членам семьи самостоятельно распоряжаться своей жизнью.\nСтрашен этот образ тем, что Кабаниха искренне считает своё поведение правильным. Она разрушает чужие судьбы, оправдывая жестокость соблюдением традиций.\nЕё образ показывает, как власть, основанная на страхе и подавлении личности, уничтожает человеческую свободу. Её фраза «Не очень-то нынче старших уважают» отражает постоянное стремление к подчинению окружающих."]],
[["Какой момент в биографии Базарова стал переломным в осознании им своей личности? Как он повлиял на его взгляды и принципы?","Переломным моментом в жизни Базарова стала любовь к Анне Сергеевне Одинцовой.\nДо встречи с ней Базаров считал любовь физиологическим явлением и не верил в романтические чувства. Он был уверен, что человек должен руководствоваться разумом и практической пользой.\nОднако, влюбившись в Одинцову, он понял, что не способен полностью контролировать свои чувства. Он признаётся: «Я люблю вас глупо, безумно...»\nЛюбовь заставляет Базарова усомниться в собственных принципах: человек намного сложнее, чем его теория. Так любовь становится испытанием, которое раскрывает внутреннее противоречие героя."],["Обломовка — «мёртвое царство» или «потерянный рай»? Аргументируйте свой ответ.","Обломовка одновременно является и «мёртвым царством», и «потерянным раем».\nС одной стороны, это место, где люди живут спокойно, в гармонии с природой, не знают серьёзных забот и конфликтов. Для маленького Обломова это настоящий рай детства.\nС другой стороны, Обломовка символизирует застой, отсутствие развития, праздность и ограниченность интересов. Именно там сформировалась пассивность главного героя.\nОбломов всю жизнь мечтает вернуться к этому идеалу спокойствия, но не понимает, что именно такое существование лишило его возможности полноценно жить. Таким образом, Обломовка — потерянный рай для самого героя, но мёртвое царство с точки зрения развития личности."]],
[["Согласны ли Вы с утверждением Л. Н. Андреева: «Настоящую любовь можно узнать по тому, насколько человек от неё становится лучше»? Какого героя можно привести в пример?","Я согласен с этим утверждением. Настоящая любовь способна раскрыть лучшие качества человека, заставить его задуматься о собственных поступках и изменить отношение к жизни.\nХорошим примером является Евгений Базаров. До встречи с Одинцовой он отрицает романтическую любовь и считает чувства проявлением слабости. Однако любовь меняет его внутренний мир: он становится более эмоциональным, уязвимым и начинает понимать сложность человеческих отношений.\nТакже можно привести пример Ольги Ильинской и Обломова. Любовь Ольги пробуждает в Обломове желание измениться и вести активную жизнь, хотя сохранить эти перемены он не смог.\nТаким образом, любовь может стать важным этапом духовного развития человека."],["«Что такое „жаль“, этого я не знаю…» Какому герою принадлежат данные слова и как они его характеризуют?","Эти слова принадлежат Сергею Сергеевичу Паратову из пьесы А. Н. Островского «Бесприданница».\nПаратов — обаятельный, богатый, уверенный в себе человек, который любит производить впечатление. Однако за внешней привлекательностью скрываются расчётливость и эгоизм.\nОн готов отказаться от дорогих ему вещей ради выгоды. Даже отношения с Ларисой не становятся для него препятствием, когда появляется возможность выгодно жениться.\nЕго слова показывают, что материальные интересы и личная выгода для него важнее чувств и привязанностей. Паратов олицетворяет человека, который ставит собственную выгоду выше нравственных принципов."]],
[["В чём ценность образа Обломова? Какую роль он сыграл в становлении характеров Ольги, Штольца, Агафьи Пшеницыной?","Ценность образа Обломова в том, что через него Гончаров показывает проблему человеческой пассивности, неиспользованных возможностей и противоречия между мечтами и реальностью.\nОбломов влияет на окружающих по-разному.\nОльга Ильинская благодаря любви к Обломову лучше понимает себя, свои чувства и жизненные цели. Неудачные отношения помогают ей повзрослеть.\nАндрей Штольц проявляет преданность другу, старается помочь ему и не допустить его полного духовного упадка.\nАгафья Пшеницына находит в Обломове смысл жизни. Она окружает его заботой и посвящает ему всё своё время.\nОбломов показывает, что даже добрый и искренний человек может погубить свои возможности, если не умеет действовать."],["Согласны ли вы с мнением Базарова, что «плохой химик полезнее поэта»? Докажите свою точку зрения примерами.","Я не полностью согласен с Базаровым. Наука и практические знания очень важны, поскольку помогают развивать общество и улучшать жизнь людей. Однако искусство также необходимо человеку: поэзия развивает чувства, воображение, способность понимать других людей и размышлять о смысле жизни.\nВ романе «Отцы и дети» Базаров отрицает поэзию, но сам оказывается неспособен объяснить свои чувства к Одинцовой исключительно научными принципами.\nВ романе «Обломов» любовь к Ольге, музыка и искусство помогают герою хотя бы на время выйти из состояния бездействия.\nПоэтому наука и искусство не должны противопоставляться. Они дополняют друг друга и делают жизнь человека более полноценной."]],
[["«Умереть так, как умер Базаров, всё равно что сделать великий подвиг» (Д. И. Писарев). Что в образе, в последних днях Базарова позволило так сказать?","Писарев считает смерть Базарова подвигом, потому что даже перед лицом смерти герой сохраняет силу характера, мужество и способность мыслить самостоятельно.\nПосле заражения при вскрытии умершего крестьянина Базаров понимает, что жизнь заканчивается. Он не пытается обмануть себя и спокойно принимает происходящее.\nОсобенно ярко раскрывается его любовь к Одинцовой: перед смертью он просит её приехать и говорит с ней искренне, без прежней самоуверенности. Его последние слова: «Дуньте на умирающую лампаду, и пусть она погаснет...»\nБазаров до конца остаётся человеком сильной воли, не теряет достоинства и не отказывается от убеждений ради удобства. Именно мужество, честность перед самим собой и стойкость позволяют Писареву говорить о его смерти как о подвиге."],["Что общего между Тихоном Кабановым и Борисом? Почему ни один из них не сделал Катерину счастливой?","Тихон Кабанов и Борис — герои пьесы А. Н. Островского «Гроза». Оба оказываются неспособными защитить Катерину и помочь ей обрести счастье.\nТихон — слабохарактерный человек, привыкший подчиняться матери. Он любит Катерину, но не может противостоять Кабанихе: «Да как же я могу, маменька, вас ослушаться!»\nБорис кажется более мягким и понимающим, однако тоже зависит от обстоятельств и не способен взять ответственность за судьбу любимой женщины.\nОба героя не обладают внутренней силой, чтобы противостоять жестоким порядкам Калинова. Поэтому ни Тихон, ни Борис не могут дать Катерине свободу, защиту и настоящую любовь."]],
[["Согласны ли вы с утверждением Л. Н. Толстого: «Любить — значит жить жизнью того, кого любишь»? Кто из героев «Обломова» мог бы быть подтверждением?","Я согласен с этим утверждением, потому что настоящая любовь предполагает заботу, внимание и готовность разделять жизнь другого человека.\nПодтверждением могут служить сразу два персонажа романа «Обломов».\nПервый — Агафья Матвеевна Пшеницына. Она полностью посвящает себя Обломову, заботится о нём и создаёт для него комфортную жизнь. Её существование во многом определяется его потребностями.\nВторой — Ольга Ильинская. Она искренне хочет помочь Обломову измениться и стать лучше, вкладывает в их отношения много душевных сил.\nОднако любовь Агафьи выражается преимущественно в заботе и принятии, а любовь Ольги — в стремлении к развитию любимого человека."],["И. С. Тургенев: «Мне мечталась фигура сумрачная, дикая, большая, сильная, злобная, честная и всё-таки обречённая на гибель». Воплощён ли этот замысел? Каково отношение Тургенева к герою?","В этом образе воплощён Евгений Базаров. Он сильная, независимая и необычная личность: не боится спорить с обществом, отказывается слепо следовать традициям и самостоятельно определяет свои взгляды.\nПри этом герой противоречив: отрицает любовь, но сам влюбляется; считает искусство бесполезным, но сталкивается с чувствами, которые не может объяснить разумом.\nТургенев относится к Базарову неоднозначно. Он показывает слабости героя, но уважает его силу характера, честность, трудолюбие и независимость.\nАвтор не высмеивает Базарова, а показывает трагедию человека, который оказался сильнее многих окружающих, но не смог преодолеть собственные внутренние противоречия."]],
[["А. В. Дружинин: «…Обломовы выдают всю прелесть, всю слабость и весь грустный комизм своей натуры именно через любовь к женщине». Как Гончаров показал «прелесть», «слабость» и «грустный комизм» Обломова?","Гончаров раскрывает характер Обломова через его отношения с Ольгой Ильинской.\nПрелесть героя — в его доброте, искренности, мягкости и способности глубоко чувствовать. Он не злой и не корыстный человек.\nСлабость проявляется в неспособности изменить себя ради любви. Обломов понимает, что Ольга ждёт от него активности, но не может отказаться от привычной пассивной жизни.\nГрустный комизм — в противоречии между мечтами и поступками: он хочет стать лучше, мечтает о счастливом будущем, но постоянно откладывает реальные действия.\nТаким образом, Гончаров показывает, что даже искреннее чувство не всегда побеждает человеческую слабость."],["Базаров об Одинцовой: «женщина-рыба». Согласны ли вы с его оценкой? Аргументируйте с опорой на текст.","Я не полностью согласен с оценкой Базарова. Он делает такие заявления, потому что привык судить о людях с позиции нигилизма и часто не учитывает их внутренний мир.\nОдинцова действительно кажется холодной, сдержанной и независимой, предпочитает спокойную жизнь сильным переживаниям. Однако это не значит, что она лишена чувств: она испытывает интерес к Базарову, но боится нарушить привычный уклад.\nБазаров сам противоречит своим словам, поскольку влюбляется в Одинцову и видит в ней человека, который имеет над ним эмоциональную власть.\nЕго оценки несправедливы: он не пытается до конца понять Одинцову и скрывает собственную уязвимость за резкими высказываниями."]],
[["Почему разошлись пути Аркадия Кирсанова и Евгения Базарова?","Аркадий и Базаров сначала становятся друзьями благодаря общим взглядам. Аркадий увлекается нигилизмом и подражает старшему товарищу, но постепенно становится понятно, что их мировоззрения различаются.\nБазаров действительно придерживается нигилизма, отрицает традиционные ценности и стремится к самостоятельности. Аркадий же увлекается этими идеями временно: по натуре он мягкий, добрый и семейный человек, ценит любовь, природу и семейные отношения.\nВ итоге Аркадий женится на Кате и выбирает спокойную семейную жизнь, а Базаров остаётся один. Базаров говорит ему: «Ты славный малый; но ты всё-таки мяконький, либеральный барич».\nИх расставание показывает, что нельзя построить дружбу только на временном увлечении чужими взглядами."],["В чём смысл финала романа «Обломов»? Как интерпретировать решение автора «отдать» сына Обломова на воспитание в семью Штольца?","В финале Обломов умирает, так и не реализовав своих мечтаний. Его жизнь проходит спокойно, но почти бесполезно с точки зрения общественной деятельности.\nСын Обломова, Андрей, после смерти отца оказывается в семье Штольца. Это символично: автор даёт ребёнку возможность получить другое воспитание и избежать судьбы отца. Штольц и Ольга должны воспитать Андрея активным, самостоятельным и образованным человеком.\nФинал подчёркивает важность воспитания и показывает надежду на то, что новое поколение сможет преодолеть недостатки предыдущего."]],
[["Почему нельзя жить только мечтами? Аргументируйте, опираясь на произведения 10 класса.","Нельзя жить только мечтами, потому что без реальных действий человек не сможет достичь поставленных целей. Мечты важны, поскольку помогают представлять будущее, но их необходимо воплощать в жизнь.\nЯркий пример — Илья Обломов из романа Гончарова. Он постоянно мечтает о счастливой семейной жизни, уютном доме и спокойствии, но ничего не делает для достижения этих целей.\nВ отличие от него, Андрей Штольц привык действовать, работать и самостоятельно строить свою судьбу.\nТакже можно вспомнить Катерину из пьесы «Гроза». Она мечтает о свободной и счастливой жизни, но оказывается в обществе, где её желания подавляются.\nТаким образом, мечты должны становиться стимулом к действию, иначе они остаются лишь фантазиями."],["Почему тема «отцов и детей» часто присутствует в литературе? Приведите примеры произведений.","Тема «отцов и детей» вечна, потому что каждое новое поколение отличается от предыдущего взглядами, ценностями и представлениями о жизни.\nОсобенно ярко она раскрыта в романе И. С. Тургенева «Отцы и дети». Базаров и Павел Петрович Кирсанов представляют разные поколения и мировоззрения, между ними постоянно возникают споры о науке, искусстве, любви и общественном устройстве.\nВ пьесе А. Н. Островского «Гроза» конфликт поколений проявляется в отношениях Кабанихи, Тихона и Катерины: старшее поколение требует подчинения традициям, а молодые герои стремятся к свободе.\nВ романе «Обломов» показано влияние родителей на судьбу ребёнка: воспитание в Обломовке сформировало пассивный характер Ильи Ильича.\nЭта тема остаётся актуальной, поскольку отражает постоянное столкновение старых и новых взглядов на жизнь."]],
[["Какую роль в становлении личности играет семья? Аргументируйте, опираясь на произведения 10 класса.","Семья играет огромную роль в становлении личности: именно в детстве человек получает первые представления о добре и зле, учится общаться, формирует характер и жизненные ценности.\nЯркий пример — Обломов. В детстве родители окружали его чрезмерной заботой и не приучали к самостоятельности, поэтому он вырос пассивным и зависимым человеком.\nДругой пример — Евгений Базаров. Его родители, Василий Иванович и Арина Власьевна, воспитали его трудолюбивым и образованным человеком. Несмотря на различие взглядов, они искренне любят сына.\nТакже можно вспомнить Катерину из «Грозы». Её детство прошло в атмосфере свободы и любви, поэтому после замужества ей особенно тяжело жить в доме Кабановых.\nСемья оказывает огромное влияние на характер человека, его мировоззрение и дальнейшую судьбу."],["Почему И. С. Тургенев «убивает» своего героя? В чём смысл такого финала?","Тургенев приводит Базарова к смерти, чтобы показать трагическое противоречие между сильной личностью и окружающей действительностью.\nБазаров — человек нового поколения, который стремится изменить общество, однако его нигилистические убеждения оказываются недостаточными для понимания всей сложности жизни.\nЛюбовь к Одинцовой заставляет его пересмотреть отношение к чувствам, а болезнь и близость смерти показывают ограниченность человеческих возможностей. Перед смертью он сохраняет мужество и достоинство: «Да, поди попробуй отрицать смерть. Она тебя отрицает, и баста!»\nСмысл финала в том, что даже сильный и талантливый человек смертен. Тургенев также показывает трагедию поколения, которое стремится разрушить старые порядки, но ещё не нашло ясного пути для создания нового общества."]],
[["Согласны ли Вы с утверждением героя Тургенева: «Всякий человек сам себя воспитать должен»? Аргументируйте свой ответ.","Я согласен с этим утверждением, потому что человек должен самостоятельно работать над своим характером, развивать способности и формировать собственные убеждения. Родители и общество оказывают большое влияние, но только сам человек решает, каким ему стать.\nПримером может служить Евгений Базаров из «Отцов и детей». Он самостоятельно формирует свои взгляды, занимается наукой и не принимает чужие убеждения без проверки.\nТакже можно вспомнить Андрея Штольца из «Обломова». Благодаря воспитанию и собственным усилиям он становится самостоятельным, трудолюбивым и целеустремлённым человеком.\nСаморазвитие — необходимое условие становления полноценной личности."],["Трагичен или комичен образ Обломова? Докажите свою точку зрения примерами из текста.","Образ Обломова одновременно трагичен и комичен.\nКомизм проявляется в его привычках, постоянной лени, нежелании заниматься делами и стремлении откладывать всё на потом. Даже обычные бытовые вопросы становятся для него серьёзной проблемой.\nТрагизм заключается в том, что Обломов обладает добрым сердцем, богатым внутренним миром и способностью любить, но не может реализовать свои возможности. Он теряет любовь Ольги, отказывается от активной жизни и постепенно замыкается в привычном мире.\nШтольц характеризует его словами: «Да, я знал одного Обломова...»\nОбраз героя вызывает не только улыбку, но и сочувствие, потому что читатель понимает: его жизнь могла сложиться совершенно иначе. Обломов — трагикомический персонаж, в судьбе которого сочетаются смешные бытовые привычки и глубокая человеческая драма."]],
[["Сопоставьте образы Евгения Базарова и Чацкого. Что между ними общего и чем они отличаются?","Евгений Базаров из «Отцов и детей» и Александр Чацкий из комедии А. С. Грибоедова «Горе от ума» — герои, которые противостоят обществу и не принимают его устаревшие порядки.\nОбщее: оба обладают независимым мышлением; не боятся высказывать собственное мнение; критикуют общественные недостатки; не принимаются большинством окружающих; стремятся к изменениям.\nРазличия: Чацкий выступает против крепостничества, чинопочитания, невежества и преклонения перед иностранным, защищает просвещение, свободу личности и человеческое достоинство. Базаров придерживается нигилизма, отрицает авторитеты, традиции, искусство и романтические чувства, доверяет науке и практическому опыту.\nОба героя — представители нового мышления, но Чацкий стремится изменить общество через просвещение и нравственные идеалы, а Базаров — через отрицание старых принципов."],["Самоубийство Катерины — проявление силы или слабости? Аргументируйте свой ответ.","Я считаю, что поступок Катерины из пьесы «Гроза» одновременно показывает её внутреннюю силу и трагическую слабость.\nС одной стороны, Катерина — свободолюбивая и искренняя женщина, которая не может смириться с лицемерием, унижением и постоянным давлением со стороны Кабанихи. Она не хочет жить во лжи и не может отказаться от стремления к свободе. Её слова: «Отчего люди не летают так, как птицы?»\nС другой стороны, финал показывает, что Катерина не смогла найти выход из ситуации и поверить в возможность другой жизни.\nЕё судьба — прежде всего обвинение обществу, в котором человек лишён свободы и поддержки. Этот поступок нельзя считать идеальным решением проблемы, но он показывает глубину отчаяния героини."]],
[["Как и под влиянием чего рушатся принципы Базарова?","Принципы Базарова начинают разрушаться под влиянием любви к Анне Сергеевне Одинцовой.\nДо встречи с ней он считает, что любовь — это исключительно физиологическое явление, а романтические чувства не имеют значения. Однако он неожиданно для себя влюбляется и понимает, что не способен контролировать собственные переживания.\nТакже на мировоззрение Базарова влияет осознание собственной смертности. После заражения во время вскрытия умершего крестьянина он понимает, что его жизнь подходит к концу.\nПеред смертью герой становится более искренним, признаёт силу своих чувств и перестаёт скрывать внутренние противоречия. Его слова: «Я нужен России... Нет, видно, не нужен».\nТаким образом, жизненные испытания показывают ограниченность нигилистических убеждений Базарова: человек не может объяснить всё исключительно разумом и наукой."],["Как вы понимаете слова Д. С. Лихачёва: «Литература даёт нам колоссальный, обширнейший и глубочайший опыт жизни»?","Я понимаю эти слова так: литература позволяет человеку познакомиться с разными характерами, судьбами и жизненными ситуациями, не переживая их самостоятельно. Читая произведения, мы учимся понимать чувства других людей, оценивать поступки и делать собственные выводы.\nРоман «Отцы и дети» учит нас тому, что нельзя отрицать человеческие чувства и считать собственные убеждения единственно правильными.\nРоман «Обломов» показывает, к чему может привести бездействие и неспособность реализовать свои мечты.\nПьеса «Гроза» заставляет задуматься о свободе личности, семейном насилии и необходимости уважать человеческое достоинство.\n«Капитанская дочка» Пушкина учит чести, верности и ответственности за собственные поступки.\nТаким образом, литература действительно даёт огромный жизненный опыт, помогает лучше понимать окружающих и формирует нравственные ориентиры человека."]],
